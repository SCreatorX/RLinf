# OpenWAM PPO on RoboTwin click_bell (aloha-agilex) with a RoboTwin study checkpoint.
# Sized for one 8-GPU node: actor on 0-1, env worker on 2, rollout on 3.
defaults:
  - env/robotwin_click_bell@env.train
  - env/robotwin_click_bell@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1
    env: 2
    rollout: 3

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_click_bell_ppo_openwam"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 40

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  reward_coef: 1.0


  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean" 
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: "EnvGroup"

  # Override the default values in env/robotwin_click_bell. OpenWAM RoboTwin
  # checkpoints act in the dataset's 20-D absolute dual-arm EEF space:
  # ``absolute_eef20`` switches RoboTwinEnv to ``ee`` control and publishes a
  # 20-D ``native_proprio`` in the same layout.
  train:
    rollout_epoch: 1
    total_num_envs: 4
    reward_coef: ${algorithm.reward_coef}
    # OpenWAM executes whole 32-action chunks; 416 = 13 chunks (preset 400 rounded up).
    max_episode_steps: 416
    max_steps_per_rollout_epoch: 416
    group_size: ${algorithm.group_size}
    assets_path: "/path/to/robotwin_assets"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/train_seeds.json
    center_crop: False
    openwam_action_representation: absolute_eef20
    video_cfg:
      save_video: False
    task_config:
      step_lim: 416
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      data_type:
        endpose: true
  eval:
    rollout_epoch: 1
    total_num_envs: 4
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 416
    reward_coef: ${algorithm.reward_coef}
    max_steps_per_rollout_epoch: 416
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    assets_path: "/path/to/robotwin_assets"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/eval_seeds.json
    center_crop: False
    openwam_action_representation: absolute_eef20
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      step_lim: 416
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      data_type:
        endpose: true

rollout:
  return_logprobs: True
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_type: "openwam"
    model_path: "/mnt/data/wangyuran/openwam_checkpoints/OpenWAM_Study_Checkpoints/architecture_study/robotwin_dual_system_joint_self_attention"
    precision: bf16
    device: cuda
    is_lora: false
    load_to_device: true
    num_frames: 33
    denoise_steps: 4
    action_dim: 20
    num_action_chunks: 32 # the whole predicted chunk, as OpenWAM's RoboTwin client executes it
    openwam:
      inference_horizon: null

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  # 4 envs * 1 rollout epoch * (416 / 32) chunks = 52 samples; one update per iteration.
  global_batch_size: 52
  seed: 42
  enable_offload: False

  model:
    model_type: "openwam"
    model_path: "/mnt/data/wangyuran/openwam_checkpoints/OpenWAM_Study_Checkpoints/architecture_study/robotwin_dual_system_joint_self_attention"
    precision: bf16
    device: cuda
    is_lora: false
    load_to_device: true
    num_frames: 33
    denoise_steps: 4
    action_dim: 20
    num_action_chunks: 32 # the whole predicted chunk (num_frames - 1)
    add_value_head: True
    openwam:
      rl_enabled: true
      noise_std: 0.05
      inference_horizon: null # execute all 32 predicted actions before regenerating

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  # Override the default values in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False