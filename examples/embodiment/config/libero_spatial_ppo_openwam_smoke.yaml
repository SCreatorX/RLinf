# Two FSDP ranks, two LIBERO subprocesses, and one rollout replica.
defaults:
  - libero_spatial_ppo_openwam
  - _self_

runner:
  max_epochs: 2
  max_steps: 2
  save_interval: -1
  logger:
    experiment_name: libero_spatial_ppo_openwam_smoke

env:
  train:
    rollout_epoch: 1
    total_num_envs: 2
    max_episode_steps: 60
    max_steps_per_rollout_epoch: 60
    video_cfg:
      save_video: false

actor:
  micro_batch_size: 1
  global_batch_size: 12
  model:
    denoise_steps: 2

rollout:
  model:
    denoise_steps: 2
