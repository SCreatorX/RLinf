# OpenWAM (RoboTwin study checkpoint, dual-system joint self-attention) on RoboTwin place_empty_cup.
# The checkpoint acts in the dataset's 20-D absolute dual-arm EEF space, so the env runs
# RoboTwin's ``ee`` controller and exposes a matching 20-D ``native_proprio``.
defaults:
  - env/robotwin_place_empty_cup@env.eval
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  # Keep the SAPIEN environments off the OpenWAM rollout GPU.
  component_placement:
    env: 0
    rollout: 1

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_place_empty_cup_openwam_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  # Override the default values in env/robotwin_place_empty_cup
  eval:
    rollout_epoch: 1
    total_num_envs: 4
    use_custom_reward: False
    use_rel_reward: True
    auto_reset: True
    ignore_terminations: True
    # OpenWAM executes whole 32-action chunks (inference_horizon null); the step
    # budget is the preset's, rounded up to a multiple of the chunk length.
    max_episode_steps: 224
    max_steps_per_rollout_epoch: 224
    reward_coef: 1.0
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    center_crop: False
    assets_path: "/path/to/robotwin_assets"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/eval_seeds.json
    # 20-D [l_xyz, l_rot6d, l_grip, r_xyz, r_rot6d, r_grip] absolute EEF targets -> ee control
    openwam_action_representation: absolute_eef20
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      step_lim: 224
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true   # three-camera layout: head on top, left/right wrist below
      data_type:
        endpose: true                # lets RoboTwin publish the end-effector poses

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_type: "openwam"
    precision: bf16
    is_lora: false
    model_path: /mnt/data/wangyuran/openwam_checkpoints/OpenWAM_Study_Checkpoints/architecture_study/robotwin_dual_system_joint_self_attention
    device: cuda
    load_to_device: false
    ckpt_name: null
    num_frames: 33
    num_action_chunks: 32   # OpenWAM's RoboTwin protocol executes the full 32-step chunk
    action_dim: 20
    height: 384
    width: 320
    denoise_steps: 10
    openwam:
      inference_horizon: null
