defaults:
  - env/libero_spatial@env.eval
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env: 2
    rollout: 3

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_openwam_eval"
    logger_backends: ["tensorboard"]
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"
  eval:
    rollout_epoch: 1
    # LIBERO subprocess workers are stable with one env per rollout group on
    # this benchmark; increase only after validating the host's renderer.
    total_num_envs: 1
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 320
    max_steps_per_rollout_epoch: 320
    group_size: 1
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    is_eval: true
    openwam_action_representation: absolute_eef10
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_type: "openwam"
    precision: bf16
    is_lora: false
    model_path: /mnt/data/wangyuran/openwam_checkpoints/openwam-libero-sft-30000
    device: cuda
    load_to_device: false
    ckpt_name: null
    num_frames: 33
    num_action_chunks: 32
    action_dim: 10
    height: 384
    width: 320
    denoise_steps: 10
